name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # 从 GitHub Secrets 注入 API Key（仓库 Settings → Secrets → Actions 添加 VITE_AGNES_API_KEY）
          VITE_AGNES_API_KEY: ${{ secrets.VITE_AGNES_API_KEY }}
          VITE_AGNES_API_URL: https://apihub.agnes-ai.cn/v1/chat/completions
          VITE_AGNES_MODEL: agnes-2.0-flash

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
